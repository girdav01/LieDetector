<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialGuard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .logo {
      font-size: 48px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 12px;
      opacity: 0.9;
    }

    .stats {
      padding: 20px;
      background: rgba(255,255,255,0.1);
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .stat-item:last-child {
      border-bottom: none;
    }

    .stat-label {
      font-size: 14px;
      opacity: 0.9;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
    }

    .status {
      padding: 20px;
      text-align: center;
    }

    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #28a745;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .footer {
      padding: 16px;
      text-align: center;
      font-size: 11px;
      opacity: 0.8;
      border-top: 1px solid rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🛡️</div>
    <h1>SocialGuard</h1>
    <div class="subtitle">Real-Time Social Engineering Defense</div>
  </div>

  <div class="stats">
    <div class="stat-item">
      <span class="stat-label">Threats Detected</span>
      <span class="stat-value" id="threatCount">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Pages Scanned</span>
      <span class="stat-value" id="pageCount">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Protection Status</span>
      <span class="stat-value">Active</span>
    </div>
  </div>

  <div class="status">
    <span class="status-indicator"></span>
    <span>All systems operational</span>
  </div>

  <div class="footer">
    v1.0.0 | Based on Unit 42 2025 Threat Intelligence
  </div>

  <script src="popup.js"></script>
</body>
</html>
